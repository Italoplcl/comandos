name: Mando
version: '${version}'
main: dev.esslite.EssLite
api-version: '26.3'
description: Mando modular para Paper/Purpur

commands:
  god:
    description: Activa o desactiva el modo dios
    usage: /god
    permission: esslite.god
  heal:
    description: Rellena tu hambre y saturacion
    usage: /heal
    permission: esslite.heal
  sethome:
    description: Guarda un home en tu posicion
    usage: /sethome [nombre]
    permission: esslite.sethome
  home:
    description: Te teletransporta a un home
    usage: /home [nombre]
    permission: esslite.home
  homes:
    description: Abre el menu de tus homes
    usage: /homes
    permission: esslite.homes
  delhome:
    description: Borra un home
    usage: /delhome <nombre>
    permission: esslite.delhome
  edithome:
    description: Edita propiedades de un home
    usage: /edithome <nombre> icon <material>
    permission: esslite.edithome
  restorehome:
    description: Recupera un home borrado o su posicion anterior
    usage: /restorehome <nombre> <deleted|previous>
    permission: esslite.restorehome
  rtp:
    description: Teletransporte aleatorio a un lugar seguro
    usage: /rtp
    permission: esslite.rtp
  fly:
    description: Activa o desactiva el vuelo
    usage: /fly
    permission: esslite.fly
  back:
    description: Vuelve a tu ubicacion anterior o al lugar donde moriste
    usage: /back
    permission: esslite.back
  spawn:
    description: Te lleva al spawn
    usage: /spawn
    permission: esslite.spawn
  setspawn:
    description: Define el spawn del mundo principal
    usage: /setspawn
    permission: esslite.setspawn
  warp:
    description: Va a un warp o lista los warps
    usage: /warp [nombre]
    permission: esslite.warp
  warps:
    description: Lista los warps disponibles
    usage: /warps
    permission: esslite.warp
  setwarp:
    description: Crea un warp en tu posicion
    usage: /setwarp <nombre>
    aliases: [addwarp]
    permission: esslite.setwarp
  delwarp:
    description: Borra un warp
    usage: /delwarp <nombre>
    aliases: [removewarp]
    permission: esslite.delwarp
  tools:
    description: Menu con las mesas de trabajo
    usage: /tools
    permission: esslite.tools
  ender:
    description: Abre tu cofre de ender
    usage: /ender
    permission: esslite.ender

  profile:
    description: Abre tu perfil o administra un perfil offline
    usage: /profile [jugador]
    permission: esslite.profile
  mail:
    description: Mailbox persistente
    usage: /mail [send|read|delete|block]
    permission: esslite.mail
  tpa:
    description: Solicita teletransporte a otro jugador
    usage: /tpa <jugador>
    permission: esslite.tpa
  tpaccept:
    description: Acepta una solicitud TPA
    permission: esslite.tpa
  tpdeny:
    description: Rechaza una solicitud TPA
    permission: esslite.tpa
  tpatoggle:
    description: Activa o desactiva solicitudes TPA
    permission: esslite.tpa
  profiletp:
    description: Teletransporte administrativo a datos de perfil
    permission: esslite.profile.admin
  changelog:
    description: Muestra las novedades del servidor en un Dialog moderno
    usage: /changelog
    permission: esslite.changelog

  serverconfig:
    description: Abre el administrador grafico de Paper/Purpur
    usage: /serverconfig [spawn|mounts]
    aliases: [scfg, purpurgui]
    permission: esslite.serverconfig

permissions:
  esslite.god:
    default: op
  esslite.heal:
    default: op
  esslite.sethome:
    default: true
  esslite.home:
    default: true
  esslite.homes:
    default: true
  esslite.delhome:
    default: true
  esslite.edithome:
    default: true
  esslite.restorehome:
    default: true
  esslite.rtp:
    default: true
  esslite.homes.unlimited:
    description: Ignora el limite de homes (maximo 54 por el menu)
    default: op
  esslite.rtp.bypass:
    description: Ignora el cooldown de /rtp
    default: op
  esslite.fly:
    default: op
  esslite.back:
    default: true
  esslite.spawn:
    default: true
  esslite.setspawn:
    default: op
  esslite.warp:
    default: true
  esslite.setwarp:
    default: op
  esslite.delwarp:
    default: op
  esslite.tools:
    default: true
  esslite.ender:
    default: true

  esslite.profile:
    default: true
  esslite.profile.admin:
    default: op
  esslite.teleport.bypass-warmup:
    default: op
  esslite.teleport.bypass-cooldown:
    default: op
  esslite.mail:
    default: true
  esslite.tpa:
    default: true
  esslite.changelog:
    default: true

  esslite.serverconfig:
    description: Permite administrar configuraciones Paper/Purpur desde GUI
    default: op
