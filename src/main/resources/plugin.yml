name: Mando
version: '${version}'
main: dev.mando.MandoPlugin
api-version: '26.3'
description: Administración moderna y modular para servidores Paper y Purpur
commands:
  mando: {description: "Panel principal de Mando", usage: "/mando [setup|config|status|providers|provider|reload|stop|backup|cleanup|diagnose|reset|changelog]", permission: mando.admin}
  god: {description: "Modo dios", usage: /god, permission: mando.god}
  heal: {description: "Rellena hambre y saturacion", usage: /heal, permission: mando.heal}
  sethome: {description: "Guarda un home", usage: "/sethome [nombre]", permission: mando.sethome}
  home: {description: "Teletransporte a home", usage: "/home [nombre]", permission: mando.home}
  homes: {description: "Menu de homes", usage: /homes, permission: mando.homes}
  delhome: {description: "Borra un home", usage: "/delhome <nombre>", permission: mando.delhome}
  renamehome: {description: "Renombra un home", usage: "/renamehome <actual> <nuevo>", permission: mando.sethome}
  restorehome: {description: "Restaura un home eliminado", usage: "/restorehome <id> <nombre>", permission: mando.homes.restore}
  rtp: {description: "Teletransporte aleatorio", usage: /rtp, permission: mando.rtp}
  fly: {description: "Vuelo", usage: /fly, permission: mando.fly}
  back: {description: "Ubicacion anterior", usage: /back, permission: mando.back}
  spawn: {description: "Ir al spawn", usage: /spawn, permission: mando.spawn}
  setspawn: {description: "Define spawn", usage: /setspawn, permission: mando.setspawn}
  warp: {description: "Ir a warp", usage: "/warp [nombre]", permission: mando.warp}
  setwarp: {description: "Crea warp", usage: "/setwarp <nombre>", aliases: [addwarp], permission: mando.setwarp}
  delwarp: {description: "Borra warp", usage: "/delwarp <nombre>", aliases: [removewarp], permission: mando.delwarp}
  tools: {description: "Mesas de trabajo", usage: /tools, permission: mando.tools}
  ender: {description: "Cofre de ender", usage: /ender, permission: mando.ender}
  tpa: {description: "Solicita TP", usage: "/tpa <jugador>", permission: mando.tpa}
  tpahere: {description: "Solicita TP hacia ti", usage: "/tpahere <jugador>", permission: mando.tpa}
  tpaccept: {description: "Acepta TPA", usage: /tpaccept, permission: mando.tpa}
  tpdeny: {description: "Rechaza TPA", usage: /tpdeny, permission: mando.tpa}
  tpcancel: {description: "Cancela TPA", usage: /tpcancel, permission: mando.tpa}
  tptoggle: {description: "Activa o desactiva TPA", usage: /tptoggle, permission: mando.tpa}
  mail: {description: "Correo offline", usage: "/mail [inbox|read|delete|inspect|jugador]", permission: mando.mail}
  profile: {description: "Perfil", usage: "/profile [jugador]", permission: mando.profile}
  afk: {description: "Alterna estado AFK", usage: /afk, permission: mando.afk}
  tp: {description: "TP administrativo", usage: "/tp <jugador> [destino]", permission: mando.tp}
  tphere: {description: "Trae un jugador", usage: "/tphere <jugador>", permission: mando.tphere}
  tppos: {description: "TP a coordenadas", usage: "/tppos <x> <y> <z> [mundo]", permission: mando.tppos}
  announce: {description: "Anuncios de servidor", usage: "/announce <chat|actionbar|title|subtitle|bossbar|stop|pause|resume|list> [mensaje]", permission: mando.announce}
  changelog: {description: "Novedades de Mando", usage: /changelog, permission: mando.changelog}
  serverconfig: {description: "Administrador grafico Paper/Purpur", usage: "/serverconfig", aliases: [scfg, purpurgui], permission: mando.serverconfig}
permissions:
  mando.admin: {default: op}
  mando.god: {default: op}
  mando.heal: {default: op}
  mando.sethome: {default: true}
  mando.home: {default: true}
  mando.homes: {default: true}
  mando.delhome: {default: true}
  mando.homes.1: {default: true}
  mando.homes.3: {default: true}
  mando.homes.5: {default: op}
  mando.homes.10: {default: op}
  mando.homes.unlimited: {default: op}
  mando.homes.restore: {default: op}
  mando.rtp: {default: true}
  mando.rtp.bypass: {default: op}
  mando.fly: {default: op}
  mando.back: {default: true}
  mando.back.bypass: {default: op}
  mando.spawn: {default: true}
  mando.setspawn: {default: op}
  mando.warp: {default: true}
  mando.setwarp: {default: op}
  mando.delwarp: {default: op}
  mando.tools: {default: true}
  mando.ender: {default: true}
  mando.tpa: {default: true}
  mando.tpa.bypass: {default: op}
  mando.mail: {default: true}
  mando.mail.inspect: {default: op}
  mando.profile: {default: true}
  mando.profile.others: {default: op}
  mando.afk: {default: true}
  mando.teleport.bypass-warmup: {default: op}
  mando.announce: {default: op}
  mando.changelog: {default: true}
  mando.serverconfig: {default: op}
  mando.tp: {default: op}
  mando.tphere: {default: op}
  mando.tppos: {default: op}
