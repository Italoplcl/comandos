name: Mando
version: '${version}'
main: dev.mando.Mando
api-version: '26.3'
description: Mando modular para Paper/Purpur
softdepend: [AuthMe, Essentials, CMI, Vault, TAB, ChatControl, PlaceholderAPI, LuckPerms]

commands:
  mando:
    description: Administración base de Mando
    usage: /mando <status|backup|diagnose|update|debug|integrations|identity|shutdown|restart>
    permission: mando.admin
  god:
    description: Activa o desactiva el modo dios
    usage: /god
    permission: mando.god
  heal:
    description: Rellena tu hambre y saturacion
    usage: /heal
    permission: mando.heal
  sethome:
    description: Guarda un home en tu posicion
    usage: /sethome [nombre]
    permission: mando.sethome
  home:
    description: Te teletransporta a un home
    usage: /home [nombre]
    permission: mando.home
  homes:
    description: Abre el menu de tus homes
    usage: /homes
    permission: mando.homes
  delhome:
    description: Borra un home
    usage: /delhome <nombre>
    permission: mando.delhome
  edithome:
    description: Edita propiedades de un home
    usage: /edithome <nombre> icon <material>
    permission: mando.edithome
  restorehome:
    description: Recupera un home borrado o su posicion anterior
    usage: /restorehome <nombre> <deleted|previous>
    permission: mando.restorehome
  rtp:
    description: Teletransporte aleatorio a un lugar seguro
    usage: /rtp
    permission: mando.rtp
  fly:
    description: Activa o desactiva el vuelo
    usage: /fly
    permission: mando.fly
  back:
    description: Vuelve a tu ubicacion anterior o al lugar donde moriste
    usage: /back
    permission: mando.back
  spawn:
    description: Te lleva al spawn
    usage: /spawn
    permission: mando.spawn
  setspawn:
    description: Define el spawn del mundo principal
    usage: /setspawn
    permission: mando.setspawn
  warp:
    description: Va a un warp o lista los warps
    usage: /warp [nombre]
    permission: mando.warp
  warps:
    description: Lista los warps disponibles
    usage: /warps
    permission: mando.warp
  setwarp:
    description: Crea un warp en tu posicion
    usage: /setwarp <nombre>
    aliases: [addwarp]
    permission: mando.setwarp
  delwarp:
    description: Borra un warp
    usage: /delwarp <nombre>
    aliases: [removewarp]
    permission: mando.delwarp
  tools:
    description: Menu con las mesas de trabajo
    usage: /tools
    permission: mando.tools
  ender:
    description: Abre tu cofre de ender
    usage: /ender
    permission: mando.ender

  profile:
    description: Abre tu perfil o administra un perfil offline
    usage: /profile [jugador]
    permission: mando.profile
  mail:
    description: Mailbox persistente
    usage: /mail [send|read|delete|block]
    permission: mando.mail
  tpa:
    description: Solicita teletransporte a otro jugador
    usage: /tpa <jugador>
    permission: mando.tpa
  tpaccept:
    description: Acepta una solicitud TPA
    permission: mando.tpa
  tpdeny:
    description: Rechaza una solicitud TPA
    permission: mando.tpa
  tpatoggle:
    description: Activa o desactiva solicitudes TPA
    permission: mando.tpa
  profiletp:
    description: Teletransporte administrativo a datos de perfil
    permission: mando.profile.admin
  changelog:
    description: Muestra las novedades del servidor en un Dialog moderno
    usage: /changelog
    permission: mando.changelog

  serverconfig:
    description: Abre el administrador grafico de Paper/Purpur
    usage: /serverconfig [setup|commands|integrations|spawn|modules|purpur|mounts]
    aliases: [scfg, purpurgui]
    permission: mando.serverconfig

permissions:
  mando.admin:
    description: Administración base, backups e identidades
    default: op
  mando.god:
    default: op
  mando.heal:
    default: op
  mando.sethome:
    default: true
  mando.home:
    default: true
  mando.homes:
    default: true
  mando.delhome:
    default: true
  mando.edithome:
    default: true
  mando.restorehome:
    default: true
  mando.rtp:
    default: true
  mando.homes.unlimited:
    description: Ignora el limite de homes (maximo 54 por el menu)
    default: op
  mando.rtp.bypass:
    description: Ignora el cooldown de /rtp
    default: op
  mando.fly:
    default: op
  mando.back:
    default: true
  mando.spawn:
    default: true
  mando.setspawn:
    default: op
  mando.warp:
    default: true
  mando.setwarp:
    default: op
  mando.delwarp:
    default: op
  mando.tools:
    default: true
  mando.ender:
    default: true

  mando.profile:
    default: true
  mando.profile.admin:
    default: op
  mando.teleport.bypass-warmup:
    default: op
  mando.teleport.bypass-cooldown:
    default: op
  mando.mail:
    default: true
  mando.tpa:
    default: true
  mando.changelog:
    default: true

  mando.serverconfig:
    description: Permite administrar configuraciones Paper/Purpur desde GUI
    default: op
