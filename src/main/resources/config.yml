homes:
  max: 3              # homes por jugador (esslite.homes.unlimited lo ignora, tope 54)
  default-name: home  # nombre usado por /sethome y /home sin argumentos

heal:
  restore-health: false   # true = /heal tambien rellena la vida

rtp:
  worlds: [world]         # mundos donde funciona /rtp (solo tipo overworld)
  min-radius: 500
  max-radius: 5000
  max-attempts: 15
  cooldown-seconds: 30
  center-on-player: false # false = centro en el spawn del mundo

spawn:
  world: ""               # vacio = mundo principal del servidor

# Mensajes en formato MiniMessage
messages:
  prefix: '<dark_gray>[<aqua>EssLite</aqua>]</dark_gray> '
  only-players: '<red>Solo los jugadores pueden usar este comando.'
  god-on: '<green>Modo dios <bold>activado</bold>.'
  god-off: '<yellow>Modo dios <bold>desactivado</bold>.'
  heal-done: '<green>Tu hambre fue rellenada.'
  home-set: '<green>Home <yellow><name></yellow> guardado.'
  home-deleted: '<yellow>Home <name> borrado.'
  home-teleported: '<green>Teletransportado a <yellow><name></yellow>.'
  home-not-found: '<red>No existe el home <yellow><name></yellow>.'
  home-choose: '<red>Tienes varios homes. Usa <yellow>/home \<nombre></yellow> o abre <yellow>/homes</yellow>.'
  home-world-missing: '<red>El mundo de ese home ya no existe.'
  no-homes: '<red>No tienes homes. Crea uno con <yellow>/sethome</yellow>.'
  invalid-name: '<red>Nombre invalido. Usa de 1 a 16 caracteres: letras, numeros, <yellow>_</yellow> o <yellow>-</yellow>.'
  homes-limit: '<red>Alcanzaste el limite de <yellow><max></yellow> homes. Borra uno con <yellow>/delhome \<nombre></yellow>.'
  teleport-failed: '<red>No se pudo teletransportar.'
  rtp-searching: '<gray>Buscando una ubicacion segura...'
  rtp-success: '<green>Teletransportado a <yellow><x>, <y>, <z></yellow>.'
  rtp-fail: '<red>No se encontro una ubicacion segura. Intenta de nuevo.'
