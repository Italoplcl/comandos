homes:
  max: 3
  default-name: home
  deleted-history: 5
heal:
  restore-health: false
rtp:
  worlds: [world]
  min-radius: 500
  max-radius: 5000
  max-attempts: 15
  cooldown-seconds: 30
  center-on-player: false
  generated-chunks-only: false
spawn:
  first-join: true
  use-for-respawn: true
messages:
  prefix: '<dark_gray>[<aqua>Mando</aqua>]</dark_gray> '
  only-players: '<red>Solo los jugadores pueden usar este comando.'
  god-on: '<green>Modo dios <bold>activado</bold>.'
  god-off: '<yellow>Modo dios <bold>desactivado</bold>.'
  heal-done: '<green>Tu hambre fue rellenada.'
  home-set: '<green>Home <yellow><name></yellow> guardado.'
  home-deleted: '<yellow>Home <name> borrado.'
  home-teleported: '<green>Teletransportado a <yellow><name></yellow>.'
  home-not-found: '<red>No existe el home <yellow><name></yellow>.'
  home-choose: '<red>Elige un home con /home <nombre> o /homes.'
  home-world-missing: '<red>El mundo de ese home ya no existe.'
  no-homes: '<red>No tienes homes.'
  invalid-name: '<red>Nombre invalido. Usa letras, numeros, _ o -.'
  homes-limit: '<red>Alcanzaste el limite de <yellow><max></yellow> homes.'
  teleport-failed: '<red>No se pudo teletransportar.'
  rtp-searching: '<gray>Buscando una ubicacion segura...'
  rtp-success: '<green>Teletransportado a <yellow><x>, <y>, <z></yellow>.'
  rtp-fail: '<red>No se encontro una ubicacion segura.'
  rtp-cooldown: '<red>Espera <yellow><seconds>s</yellow> para volver a usar /rtp.'
  rtp-busy: '<red>Ya estamos buscando una ubicacion para ti.'
  rtp-world: '<red>/rtp no esta disponible en este mundo.'
  menu-title: '<dark_aqua>Tus homes'
  menu-item-name: '<yellow><name>'
  menu-lore:
    - '<gray>Mundo: <white><world>'
    - '<gray>Coordenadas: <white><x>, <y>, <z>'
    - ''
    - '<green>Clic izquierdo: <white>teletransportar'
    - '<red>Shift + clic derecho: <white>borrar'
  fly-on: '<green>Vuelo <bold>activado</bold>.'
  fly-off: '<yellow>Vuelo <bold>desactivado</bold>.'
  fly-creative: '<red>Tu modo de juego actual ya te permite volar.'
  back-none: '<red>No tienes una ubicacion anterior guardada.'
  back-teleported: '<green>Volviste a tu ubicacion anterior.'
  spawn-teleported: '<green>Teletransportado al spawn.'
  spawn-set: '<green>Spawn del mundo actualizado.'
  spawn-wrong-world: '<red>El spawn solo se puede definir en <yellow><world></yellow>.'
  warp-set: '<green>Warp <yellow><name></yellow> guardado.'
  warp-deleted: '<yellow>Warp <name> borrado.'
  warp-not-found: '<red>No existe el warp <yellow><name></yellow>.'
  warp-name-required: '<red>Debes indicar un nombre de warp.'
  warp-teleported: '<green>Teletransportado al warp <yellow><name></yellow>.'
  warps-none: '<red>No hay warps creados.'
  warps-header: '<gray>Warps: '
  warp-hover: '<gray>Clic para ir'
  no-permission: '<red>No tienes permiso para hacer eso.'
  tools-title: '<dark_aqua>Mesas de trabajo'
  tool-lore: '<gray>Clic para abrir'
  tool-crafting: '<yellow>Mesa de crafteo'
  tool-anvil: '<yellow>Yunque'
  tool-smithing: '<yellow>Mesa de herreria'
  tool-stonecutter: '<yellow>Cortapiedras'
  tool-loom: '<yellow>Telar'
  tool-cartography: '<yellow>Mesa de cartografia'
  tool-grindstone: '<yellow>Piedra de afilar'
  tool-enchanting: '<yellow>Mesa de encantamientos'
  tool-ender: '<light_purple>Cofre de ender'
  home-marker-failed: '<yellow>Home guardado, pero no pude colocar su marcador.'
  marker-no-space: '<yellow>Ubicacion guardada, pero no hay espacio seguro para el marcador.'
modules:
  rtp: {enabled: true}
  homes: {enabled: true}
  warps: {enabled: true}
  spawn: {enabled: true}
  changelog: {enabled: true}
  server-config:
    enabled: true
    purpur:
      enabled: true
      mounts: {enabled: false}
      mobs: {enabled: true}
      gameplay: {enabled: true}
      breeding: {enabled: true}
      raids: {enabled: true}
markers:
  homes:
    enabled: true
    mode: SIGN_FALLBACK_HOLOGRAM
    max-distance: 5
    cleanup-radius: 6
    glowing: true
    decoration: "--------"
  warps:
    enabled: true
    color-selector: true
  spawn:
    enabled: true
    particles:
      enabled: true
      view-distance: 16
      interval-ticks: 20
setup:
  show-to-op: true
  completed: false
changelog:
  version: "1.7.0-test"
  date: "2026-10-03"
  lines:
    - "Profile interactivo con acceso a correo y Homes."
    - "Mail con bandeja, lectura, borrado e inspeccion administrativa auditada."
    - "TPA persistente con expiracion, anti-spam y teletransporte comun."
    - "Homes con historial de eliminados y restauracion."
    - "Back persistente e historial de muertes."
    - "AFK Purpur-first, AuthMe opcional y Vault de solo lectura."
    - "Registro persistente de marcadores."
    - "Idiomas externos ES/EN."
    - "Backups programados, shutdown, auditoria y diagnostico."
updates:
  enabled: true
  channel: STABLE

back:
  cooldown-seconds: 10
  persistent: true
  admin-teleport-creates-back: true
  hazards:
    lava-fire-magma: ALLOW
    suffocation: SAFE_NEARBY
    void-border: DENY

teleport:
  warmup: 3
  cancel-on-move: true
  cancel-on-damage: true
  cooldown: 5
tpa:
  expire-seconds: 30
  anti-spam-seconds: 3
mail:
  enabled: true
  max-messages: 50
  max-length: 500
  cooldown-seconds: 10
deaths:
  history-size: 5
providers:
  homes: Mando
  warps: Mando
  spawn: Mando
  back: Mando
  rtp: Mando
  afk: Purpur
backups:
  scheduled:
    enabled: true
    interval-minutes: 360
  shutdown:
    enabled: true
  rotation:
    scheduled: 7
    shutdown: 3
join-notifications:
  mail: {enabled: true}
  changelog: {enabled: true}
language: es
announcements:
  enabled: false
  interval-seconds: 300
  bossbar-seconds: 10
  messages: []

shutdown:
  schedule:
    enabled: false
    time: "04:00"
    warning-minutes: 30
