admin:
  debug: false
update-checker:
  enabled: false
  metadata-url: ""
announcements:
  enabled: false
  interval-seconds: 300
  join:
    enabled: false
    delay-seconds: 3
    message: "<aqua>Bienvenido al servidor.</aqua>"
  items:
    - message: "<yellow>Recuerda revisar las novedades con /changelog.</yellow>"
      channels: [CHAT]
      duration-seconds: 5
      command: ""
    - message: "<red>Reinicio del servidor</red>"
      channels: [BOSSBAR, CHAT]
      duration-seconds: 10
      command: ""

setup:
  completed: false
  ecosystem-signature: ""
language: es
integrations:
  afk:
    provider: AUTO
    mando:
      timeout-seconds: 300
  vault:
    read-only: true
back:
  enabled: true

homes:
  max: 3              # homes por jugador (mando.homes.unlimited lo ignora, tope 54)
  default-name: home  # nombre usado por /sethome y /home sin argumentos

heal:
  restore-health: false   # true = /heal tambien rellena la vida

rtp:
  worlds: [world]         # mundos donde funciona /rtp (solo tipo overworld)
  min-radius: 500
  max-radius: 5000
  max-attempts: 15
  center-on-player: false # false = centro en el spawn del mundo

spawn:
  world: ""               # vacio = mundo principal del servidor

# Mensajes en formato MiniMessage
messages:
  prefix: '<dark_gray>[<aqua>Mando</aqua>]</dark_gray> '
  only-players: '<red>Solo los jugadores pueden usar este comando.'
  god-on: '<green>Modo dios <bold>activado</bold>.'
  god-off: '<yellow>Modo dios <bold>desactivado</bold>.'
  heal-done: '<green>Tu hambre fue rellenada.'
  home-overwrite-confirm: '<yellow>Ya existe el home <name>. Haz clic aquí o usa <white>/sethome <name> confirm</white> para reemplazarlo.'
  home-set: '<green>Home <yellow><name></yellow> guardado.'
  home-deleted: '<yellow>Home <name> borrado.'
  home-teleported: '<green>Teletransportado a <yellow><name></yellow>.'
  home-not-found: '<red>No existe el home <yellow><name></yellow>.'
  home-choose: '<red>Tienes varios homes. Usa <yellow>/home \<nombre></yellow> o abre <yellow>/homes</yellow>.'
  home-world-missing: '<red>El mundo de ese home ya no existe.'
  no-homes: '<red>No tienes homes. Crea uno con <yellow>/sethome</yellow>.'
  invalid-name: '<red>Nombre invalido. Usa de 1 a 16 caracteres: letras, numeros, <yellow>_</yellow> o <yellow>-</yellow>.'
  homes-limit: '<red>Alcanzaste el limite de <yellow><max></yellow> homes. Borra uno con <yellow>/delhome \<nombre></yellow>.'
  teleport-failed: '<red>No se pudo teletransportar.'
  rtp-searching: '<gray>Buscando una ubicacion segura...'
  rtp-success: '<green>Teletransportado a <yellow><x>, <y>, <z></yellow>.'
  rtp-fail: '<red>No se encontro una ubicacion segura. Intenta de nuevo.'
  rtp-busy: '<red>Ya estamos buscando una ubicacion para ti.'
  rtp-world: '<red>/rtp no esta disponible en este mundo.'
  menu-title: '<dark_aqua>Tus homes'
  menu-item-name: '<yellow><name>'
  menu-lore:
    - '<gray>Mundo: <white><world>'
    - '<gray>Coordenadas: <white><x>, <y>, <z>'
    - ''
    - '<green>Clic izquierdo: <white>teletransportar'
    - '<red>Shift + clic derecho: <white>borrar'
  fly-on: '<green>Vuelo <bold>activado</bold>.'
  fly-off: '<yellow>Vuelo <bold>desactivado</bold>.'
  fly-creative: '<red>Tu modo de juego actual ya te permite volar.'
  back-none: '<red>No tienes una ubicacion anterior guardada.'
  back-teleported: '<green>Volviste a tu ubicacion anterior.'
  spawn-teleported: '<green>Teletransportado al spawn.'
  spawn-set: '<green>Spawn del mundo actualizado.'
  spawn-wrong-world: '<red>El spawn solo se puede definir en el mundo <yellow><world></yellow>.'
  warp-set: '<green>Warp <yellow><name></yellow> guardado.'
  warp-deleted: '<yellow>Warp <name> borrado.'
  warp-not-found: '<red>No existe el warp <yellow><name></yellow>.'
  warp-name-required: '<red>Debes indicar un nombre de warp.'
  warp-teleported: '<green>Teletransportado al warp <yellow><name></yellow>.'
  warps-none: '<red>No hay warps creados.'
  warps-header: '<gray>Warps: '
  warp-hover: '<gray>Clic para ir'
  no-permission: '<red>No tienes permiso para hacer eso.'
  tools-title: '<dark_aqua>Mesas de trabajo'
  tool-lore: '<gray>Clic para abrir'
  tool-crafting: '<yellow>Mesa de crafteo'
  tool-anvil: '<yellow>Yunque'
  tool-smithing: '<yellow>Mesa de herreria'
  tool-stonecutter: '<yellow>Cortapiedras'
  tool-loom: '<yellow>Telar'
  tool-cartography: '<yellow>Mesa de cartografia'
  tool-grindstone: '<yellow>Piedra de afilar'
  tool-enchanting: '<yellow>Mesa de encantamientos'
  tool-ender: '<light_purple>Cofre de ender'
  home-edit-usage: '<yellow>Uso: /edithome <nombre> icon <material>.'
  home-icon-invalid: '<red>Ese material no sirve como icono.'
  home-icon-set: '<green>Icono de <yellow><name></yellow> cambiado a <white><icon></white>.'
  home-restore-usage: '<yellow>Uso: /restorehome <nombre> <deleted|previous>.'
  home-restored: '<green>Home <yellow><name></yellow> recuperado.'
  home-restore-none: '<red>No hay una copia recuperable de <yellow><name></yellow>.'
  home-marker-failed: '<yellow>Home guardado, pero no pude colocar el cartel en la superficie indicada.'
  marker-no-space: '<yellow>La ubicación fue guardada, pero no hay espacio seguro para colocar el marcador.'
  mail-sent: '<green>Correo enviado.'
  mail-blocked: '<red>Ese jugador te ha bloqueado.'
  mail-none: '<red>No se encontró ese correo.'
  mail-deleted: '<yellow>Correo eliminado.'
  mail-block-on: '<yellow>Remitente bloqueado.'
  mail-block-off: '<green>Remitente desbloqueado.'
  mail-usage: '<yellow>Uso: /mail o /mail send <jugador> <mensaje>.'
  tpa-usage: '<yellow>Uso: /tpa <jugador>.'
  player-not-found: '<red>Jugador no encontrado.'
  tpa-disabled-target: '<red>Ese jugador no acepta solicitudes TPA.'
  tpa-sent: '<green>Solicitud TPA enviada.'
  tpa-received: '<yellow>Recibiste una solicitud TPA. Usa /tpaccept o /tpdeny.'
  tpa-none: '<red>No tienes una solicitud TPA válida.'
  tpa-accepted: '<green>Solicitud TPA aceptada.'
  tpa-denied: '<yellow>Solicitud TPA rechazada.'
  tpa-on: '<green>Solicitudes TPA activadas.'
  tpa-off: '<yellow>Solicitudes TPA desactivadas.'
  teleport-warmup: '<yellow>Teletransporte en <seconds>s. No te muevas ni recibas daño.'
  teleport-cancelled: '<red>Teletransporte cancelado.'
  teleport-cooldown: '<red>Espera <seconds>s para volver a teletransportarte.'
  teleport-invalid: '<red>El destino ya no está disponible.'
  teleport-unsafe: '<red>El destino no es seguro.'
  admin-tp-done: '<green>Teletransporte administrativo completado.'

# Módulos: false significa que Mando no inicializa/expone esa función cuando sea posible.
modules:
  homes:
    enabled: true
  warps:
    enabled: true
  spawn:
    enabled: true
  changelog:
    enabled: true
  profile:
    enabled: true
  mail:
    enabled: true
  tpa:
    enabled: true
  server-config:
    enabled: true
    purpur:
      enabled: true
      mounts:
        enabled: false  # opt-in: no consume lógica de monturas si no la quieres
      mobs:
        enabled: true
      gameplay:
        enabled: true
      breeding:
        enabled: true
      raids:
        enabled: true

teleport:
  safety:
    enabled: true
  default-warmup-seconds: 3
  default-cooldown-seconds: 5
  cancel-on-damage: true
  cancel-move-distance: 0.15
  home:
    warmup-seconds: 3
    cooldown-seconds: 5
  stored:
    warmup-seconds: 3
    cooldown-seconds: 5
  back:
    warmup-seconds: 3
    cooldown-seconds: 5
  tpa:
    warmup-seconds: 3
    cooldown-seconds: 5
  admin:
    warmup-seconds: 0
    cooldown-seconds: 0
  rtp:
    warmup-seconds: 3
    cooldown-seconds: 30

profile:
  deaths-kept: 10

tpa:
  timeout-seconds: 60

markers:
  homes:
    enabled: true
    max-distance: 5
    glowing: true
    decoration: "--------"
  warps:
    enabled: true
    color-selector: true
  spawn:
    enabled: true
    particles:
      enabled: true
      view-distance: 16
      interval-ticks: 20

changelog:
  version: "1.7.0-test"
  history:
    - version: "1.7.0-test"
      link: ""
      lines:
        - "Storage por jugador e integraciones modernizadas."
        - "Setup moderno y administración del servidor."
        - "Announcements, diagnóstico y operaciones protegidas."
  legacy-version: "1.2.1"
  lines:
    - "Mando ahora usa Dialogs modernos de Minecraft."
    - "Nuevo sistema visual de marcadores para Homes, Warps y Spawn."
    - "Base modular para Paper y Purpur."
    - "Corrección de escritura y respaldo de purpur.yml."
    - "Nuevo menú Modules y módulos Purpur para pruebas."
    - "Banners de Warp y Spawn orientados según la mirada."
    - "Carteles Home escritos en ambas caras."
# Mensajes adicionales 1.2.0 (se leen desde messages.*)
